<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книжковий пазл</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.game {
    width: 100%;
    max-width: 500px;
    text-align: center;
}

h1 {
    margin: 0 0 8px;
}

.info {
    margin-bottom: 15px;
}

#board {
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    background: #000;
    padding: 2px;
    touch-action: none;
}

.tile {
    width: 100%;
    aspect-ratio: 1;
    background-repeat: no-repeat;
    background-image: url("./1785174577223.png");
    background-size: 400% 400%;
    cursor: grab;
}

.tile.dragging {
    opacity: 0.5;
}

button {
    margin-top: 18px;
    padding: 12px 25px;
    border: 0;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
}

#message {
    margin-top: 15px;
    font-size: 22px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="game">

<h1>🧩 Книжковий пазл</h1>

<div class="info">
Перетягуй деталі пальцем
</div>

<div id="board"></div>

<button onclick="newGame()">🔄 Перемішати</button>

<div id="message"></div>

</div>

<script>

const board = document.getElementById("board");
const message = document.getElementById("message");

const size = 4;
const total = 16;

function createTile(number) {

    const tile = document.createElement("div");

    tile.className = "tile";

    tile.dataset.correct = number;

    const row = Math.floor(number / size);
    const col = number % size;

    tile.style.backgroundPosition =
        (col * 100 / 3) + "% " +
        (row * 100 / 3) + "%";

    tile.addEventListener("click", function() {
        selectTile(tile);
    });

    return tile;
}

let selected = null;

function selectTile(tile) {

    if (!selected) {

        selected = tile;
        tile.style.outline = "4px solid white";

    } else {

        if (selected !== tile) {

            swap(selected, tile);

        }

        selected.style.outline = "";
        selected = null;

        checkWin();
    }
}

function swap(a, b) {

    const aNext = a.nextSibling;
    const bNext = b.nextSibling;

    if (aNext === b) {

        board.insertBefore(b, a);

    } else if (bNext === a) {

        board.insertBefore(a, b);

    } else {

        board.insertBefore(a, bNext);
        board.insertBefore(b, aNext);
    }
}

function newGame() {

    board.innerHTML = "";
    message.textContent = "";
    selected = null;

    let numbers = [];

    for (let i = 0; i < total; i++) {
        numbers.push(i);
    }

    do {

        numbers.sort(() => Math.random() - 0.5);

    } while (numbers.every((n, i) => n === i));

    numbers.forEach(number => {
        board.appendChild(createTile(number));
    });
}

function checkWin() {

    const tiles = board.children;

    for (let i = 0; i < total; i++) {

        if (Number(tiles[i].dataset.correct) !== i) {
            return;
        }
    }

    message.textContent = "🎉 Пазл складено!";
}

newGame();

</script>

</body>
</html>
